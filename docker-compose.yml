services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certificates
      POSTGRES_USER: certificate_user
      POSTGRES_PASSWORD: certificate_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certificate_user -d certificates"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://certificate_user:certificate_password@db:5432/certificates
      STORAGE_DIR: generated
      ENVIRONMENT: docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./generated:/app/generated

volumes:
  postgres_data:
